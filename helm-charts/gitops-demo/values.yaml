##########################################################
# Replica Configuration
##########################################################

replicaCount: 1

##########################################################
# Container Image
##########################################################

image:
  repository: asia-south1-docker.pkg.dev/vishnu-cloud-lab/gitops-images/gitops-demo
  tag: "f1f60574d841e95d294049997e5f4b9b631e4516"
  pullPolicy: Always

##########################################################
# Service
##########################################################

service:
  type: ClusterIP
  port: 80
  targetPort: 80

##########################################################
# Container Port
##########################################################

containerPort: 80

##########################################################
# Resources
##########################################################

resources:
  requests:
    cpu: "25m"
    memory: "64Mi"

  limits:
    cpu: "100m"
    memory: "128Mi"

##########################################################
# Service Account
##########################################################

serviceAccount:
  create: true
  name: ""

##########################################################
# Ingress
##########################################################

##########################################################
# Ingress
##########################################################

ingress:
  enabled: true

  className: nginx

  annotations: {}

  hosts:
    - host: app.vishnupochampalli.work.gd
      paths:
        - path: /
          pathType: Prefix

  tls: []

##########################################################
# Autoscaling
##########################################################

autoscaling:
  enabled: false

##########################################################
# Node Selector
##########################################################

nodeSelector: {}

##########################################################
# Tolerations
##########################################################

tolerations: []

##########################################################
# Affinity
##########################################################

affinity: {}