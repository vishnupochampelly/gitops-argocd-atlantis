apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: networking
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vishnupochampelly/gitops-argocd-atlantis.git
    targetRevision: main
    path: ingress

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true